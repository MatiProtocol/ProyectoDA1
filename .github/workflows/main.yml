name: runTest
on:
  push:
    branches:
      - main
      - develop
      - release
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Update apt repository
        run: sudo apt-get update
      - name: Install dotnet
        run: sudo apt-get install -y dotnet-sdk-8.0
      - name: Runing tests
        run: dotnet test Tests -v m && dotnet test TestDB